name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes-flutter:
    name: Testes Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --coverage

  regras-firestore:
    name: Regras do Firestore
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firestore-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run test:emulador

  apk:
    name: Gerar APK
    needs: testes-flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: move-challenge-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  e2e-android:
    name: Ponta a ponta (Maestro)
    needs: testes-flutter
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Habilitar aceleração do emulador (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Compilar APK apontando para os emuladores do Firebase
        run: |
          flutter pub get
          flutter build apk --debug --dart-define=USE_FIREBASE_EMULATORS=true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Firebase CLI e Maestro
        run: |
          npm install -g firebase-tools
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Subir emuladores do Firebase (Auth e Firestore)
        run: |
          firebase emulators:start --only auth,firestore --project move-challenge-b5aa8 > emuladores.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s http://127.0.0.1:8080 > /dev/null && curl -s http://127.0.0.1:9099 > /dev/null; then
              echo "Emuladores prontos"; exit 0
            fi
            sleep 2
          done
          echo "Os emuladores não subiram a tempo"; cat emuladores.log; exit 1

      - name: Rodar os fluxos no emulador Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install build/app/outputs/flutter-apk/app-debug.apk
            maestro test .maestro --format junit --output maestro-relatorio.xml --test-output-dir maestro-evidencias

      - name: Publicar relatório e evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-resultados
          path: |
            maestro-relatorio.xml
            maestro-evidencias/
            emuladores.log
